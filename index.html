    return E('div', null,
      E('div', { style: { display: 'flex', gap: 8, marginBottom: 10 } },
        chip('store', '\ud83c\udfea Store / Warehouse', type, t => pick(t, t === 'store' ? ((storeList[0] || {}).id || '') : '')),
        chip('tank', '\ud83d\udee2\ufe0f Tank', type, t => pick(t, ''))),
      type === 'store'
        ? E('select', { className: 'fi', value: id, onChange: e => pick('store', e.target.value) }, E('option', { value: '' }, 'Select store\u2026'),
            storeList.map(w => E('option', { key: w.id, value: w.id }, w.name + ' (' + w.code + ')')))
        : E('select', { className: 'fi', value: id, onChange: e => pick('tank', e.target.value) }, E('option', { value: '' }, tanks.length ? 'Select tank\u2026' : 'No tanks \u2014 create one in Tanks first'),
            tanks.map(t => E('option', { key: t.id, value: t.id, disabled: t.status === 'Disabled' || t.status === 'Maintenance' },

  };

  const body = step === 1 ? E('div', null, E('h3', { style: { margin: '0 0 10px', fontSize: 14 } }, 'Where is the product coming from?'), locPicker('src'),
      srcTank ? E('div', { className: 'alert alert-blue', style: { marginTop: 10, marginBottom: 0 } }, E(Ic, { n: 'info', s: 13 }), srcTank.name + ' holds ' + (srcTank.product ? qtyFmt(srcTank.qty) + ' ' + srcTank.unit + ' of ' + srcTank.product : 'nothing right now') + ' \u00b7 ' + srcTank.status) : null)
    : step === 2 ? E('div', null, E('h3', { style: { margin: '0 0 10px', fontSize: 14 } }, 'Where is it going?'), locPicker('dst'),
      sameLoc ? E('div', { className: 'alert alert-red', style: { marginTop: 10, marginBottom: 0 } }, E(Ic, { n: 'alert', s: 13 }), 'Source and destination must be different') : null,
      dstTank ? E('div', { className: 'alert alert-blue', style: { marginTop: 10, marginBottom: 0 } }, E(Ic, { n: 'info', s: 13 }),
        dstTank.name + ': ' + (dstTank.product ? qtyFmt(dstTank.qty) + ' ' + dstTank.unit + ' of ' + dstTank.product : 'empty') + (dstFree != null ? ' \u00b7 ' + qtyFmt(dstFree) + ' ' + dstTank.unit + ' free' : '')) : null)
    : step === 3 ? E('div', null, E('h3', { style: { margin: '0 0 10px', fontSize: 14 } }, 'Which product?'),

function tankStats(tankId) {
  const runs = unifiedRuns().filter(p => p.tankId === tankId);
  const done = runs.filter(p => p.status === 'Completed');
  const timed = done.filter(p => p.runSeconds != null);
  const secs = done.reduce((s, p) => s + (p.runSeconds || 0), 0);
  const latest = [...done].sort((a, b) => String(b.completedAt || b.date).localeCompare(String(a.completedAt || a.date)))[0] || null;
  return { runs, done, count: done.length, totalOut: done.reduce((s, p) => s + (p.actualQty || 0), 0), totalIn: done.reduce((s, p) => s + p.inQty, 0),
    secs, avg: timed.length ? secs / timed.length : 0, latest };
}

// ── dates / shift windows (all LOCAL time) ──
const localDate = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const addDays = (s, n) => { const x = new Date(s + 'T12:00:00'); x.setDate(x.getDate() + n); return localDate(x); };
const clockOf = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const tsOf = (dateStr, hm) => new Date(dateStr + 'T' + (hm && /^\d\d:\d\d/.test(hm) ? String(hm).slice(0, 5) : '12:00') + ':00');
const opsWindow = (date, period, shift, cfg) => {
  const T = (d, hm) => new Date(d + 'T' + hm + ':00');
  const a = cfg.shiftDayFrom || '08:00', b = cfg.shiftDayTo || '20:00';
  let w;
  if (period === 'week') w = { start: T(addDays(date, -6), '00:00'), end: T(addDays(date, 1), '00:00'), days: 7, label: 'Last 7 days to ' + date };
  else if (period === 'month') {
    const f = date.slice(0, 8) + '01'; const nx = new Date(f + 'T12:00:00'); nx.setMonth(nx.getMonth() + 1); const nf = localDate(nx).slice(0, 8) + '01';
    w = { start: T(f, '00:00'), end: T(nf, '00:00'), days: Math.round((T(nf, '00:00') - T(f, '00:00')) / 864e5), label: 'Month of ' + date.slice(0, 7) };
  }
  else if (shift === 'day') w = { start: T(date, a), end: T(date, b), days: 1, label: 'Day shift ' + a + '\u2013' + b };
  else if (shift === 'night') w = { start: T(date, b), end: T(addDays(date, 1), a), days: 1, label: 'Night shift ' + b + '\u2013' + a };
  else w = { start: T(date, '00:00'), end: T(addDays(date, 1), '00:00'), days: 1, label: 'Full day' };
  w.hours = (w.end - w.start) / 36e5; return w;
};
const inWin = (win, dateStr, hm) => { if (!dateStr) return false; const t = tsOf(dateStr, hm); return t >= win.start && t < win.end; };

// ── formatting ──
const MT_UNITS = ['MT', 'TON', 'TONS', 'TONNE', 'TONNES'];
const qf = (n, unit) => { n = Number(n || 0); return MT_UNITS.includes(String(unit || '').toUpperCase()) ? n.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) : n.toLocaleString('en-US', { maximumFractionDigits: 3 }); };
const locShort = (type, id) => type === 'store' ? ((whSvc.getById(id) || {}).name || 'Store') : ((tankSvc.getById(id) || {}).name || 'Tank');
const nm = s => String(s || '').toLowerCase().trim();
const nameHit = (name, key) => { const a = nm(name), b = nm(key); return !!b && a.includes(b); };

// ── data (read-only; every stock number comes straight from Supabase) ──
const opsSvc = {
  _items: null, _at: 0,

    const [items, stock, grn, gin, trn] = await Promise.all([
      this.items(),
      pagedSelect('stock', 'select=item_id,warehouse_id,qty'),
      pagedSelect('purchases', `select=id,grn_no,date,warehouse_id,approved_at,created_at,purchase_items(item_id,item_name,unit,qty_received)&status=eq.Approved&${rng}`),
      pagedSelect('gin_vouchers', `select=id,gin_no,date,warehouse_id,issued_to,approved_at,created_at,gin_items(item_id,item_name,unit,qty_issued)&status=eq.Approved&${rng}`),
      pagedSelect('stock_transfers', `select=id,trn_no,date,from_warehouse_id,to_warehouse_id,approved_at,created_at,transfer_items(item_id,unit,qty)&status=eq.Approved&${rng}`),
    ]);
    return { items, stock, grn, gin, trn };

// ── turn raw records into the nine panels ──
function opsCompute(D, cfg, o) {
  const { win, user, isSA, whId } = o;
  const whOk = id => !whId || id === whId;
  const itemById = new Map(D.items.map(i => [i.id, i]));
  const cats = catSvc.getAll(); const catName = id => (cats.find(c => c.id === id) || {}).name || id || 'Other';
  const runClock = r => r.endTime ? fmtTime(r.endTime) : r.startTime ? fmtTime(r.startTime) : clockOf(r.completedAt || r.createdAt);
  const runTs = r => tsOf(r.date, runClock(r));

  // runs = Tank Production runs + Production vouchers, inside the window
  const runsW = unifiedRuns(user, isSA).filter(r => r.status !== 'Cancelled' && inWin(win, r.date, runClock(r)));
  const done = runsW.filter(r => r.status === 'Completed');

  // 1 PRODUCTION
  let cards;
  if (cfg.products && cfg.products.length) {
    cards = cfg.products.map(p => {
      const rs = done.filter(r => nameHit(r.outProduct, p.match || p.name));
      const produced = rs.reduce((s, r) => s + (r.actualQty || 0), 0), target = (Number(p.target) || 0) * win.days;
      return { name: p.name, unit: (rs[0] && rs[0].unit) || p.unit || '', target, produced, pct: target > 0 ? produced / target * 100 : null, runs: rs };
    });
  } else {
    const g = new Map(); done.forEach(r => { const k = r.outProduct || '-'; if (!g.has(k)) g.set(k, []); g.get(k).push(r); });
    cards = [...g.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 2).map(([k, rs]) => ({ name: k, unit: rs[0].unit, target: 0, produced: rs.reduce((s, r) => s + (r.actualQty || 0), 0), pct: null, runs: rs }));
  }
  const matched = new Map(); cards.forEach(c => c.runs.forEach(r => matched.set(r.id, r)));
  const planned = [...matched.values()].filter(r => r.plannedQty > 0 && r.actualQty != null);
  const effPlan = planned.reduce((s, r) => s + r.plannedQty, 0), effOut = planned.reduce((s, r) => s + r.actualQty, 0);
  const withTarget = cards.filter(c => c.target > 0), total = cards.reduce((s, c) => s + c.produced, 0);
  const minPct = withTarget.length ? Math.min(...withTarget.map(c => c.pct)) : null;
  const status = total <= 0 ? 'No production' : minPct == null ? 'Recorded' : minPct >= 100 ? 'On Track' : minPct >= 70 ? 'In Progress' : 'Behind';
  const prod = { cards, total, unit: (cards[0] && cards[0].unit) || '', batches: matched.size, eff: effPlan > 0 ? effOut / effPlan * 100 : (withTarget.length && total > 0 ? total / withTarget.reduce((s, c) => s + c.target, 0) * 100 : null), status };

  // 2 RUNNING HR
  const totalSecs = runsW.reduce((s, r) => s + (r.runSeconds || 0), 0);
  const latest = [...runsW].sort((a, b) => runTs(b) - runTs(a))[0] || null;
  const run = { totalSecs, latest, util: win.hours > 0 ? Math.min(100, totalSecs / (win.hours * 3600) * 100) : 0, count: runsW.length };

  // 3 MATERIAL RECEIVED (approved GRVs, grouped by item category)
  const groups = new Map();
  D.grn.filter(v => whOk(v.warehouse_id) && inWin(win, v.date, clockOf(v.approved_at || v.created_at))).forEach(v => (v.purchase_items || []).forEach(l => {
    const it = itemById.get(l.item_id) || {}, c = it.category || 'Other', n = it.name || l.item_name || '-';
    if (!groups.has(c)) groups.set(c, { id: c, name: catName(c), items: new Map(), lines: 0 });
    const g = groups.get(c); g.lines++; const cur = g.items.get(n) || { name: n, unit: l.unit || it.unit, qty: 0 }; cur.qty += Number(l.qty_received || 0); g.items.set(n, cur);
  }));
  const pri = n => /raw/i.test(n) ? 0 : /pack/i.test(n) ? 1 : /util/i.test(n) ? 2 : 3;
  const recv = [...groups.values()].sort((a, b) => pri(a.name) - pri(b.name) || b.lines - a.lines).slice(0, 3)
    .map(g => ({ id: g.id, name: g.name, items: [...g.items.values()].sort((a, b) => b.qty - a.qty) }));

  // 4 TRANSFERS (completed fills + approved warehouse transfers)
  const trnRows = [];
  fillSvc.getAll().filter(f => f.status === 'Completed' && inScopeFill(f, user, isSA)).forEach(f => {
    const hm = f.time ? fmtTime(f.time) : clockOf(f.completedAt);
    if (inWin(win, f.date, hm)) trnRows.push({ key: 'f' + f.id, from: locShort(f.srcType, f.srcId), to: locShort(f.dstType, f.dstId), material: f.product, qty: f.qty, unit: f.unit, time: hm, ts: tsOf(f.date, hm) });
  });
  D.trn.filter(v => (whOk(v.from_warehouse_id) || whOk(v.to_warehouse_id))).forEach(v => {
    const hm = clockOf(v.approved_at || v.created_at); if (!inWin(win, v.date, hm)) return;
    const ls = v.transfer_items || [], first = itemById.get((ls[0] || {}).item_id) || {};
    trnRows.push({ key: 't' + v.id, from: locShort('store', v.from_warehouse_id), to: locShort('store', v.to_warehouse_id), material: (first.name || '-') + (ls.length > 1 ? ' +' + (ls.length - 1) : ''), qty: ls.reduce((s, l) => s + Number(l.qty || 0), 0), unit: (ls[0] || {}).unit || first.unit || '', time: hm, ts: tsOf(v.date, hm) });
  });
  trnRows.sort((a, b) => b.ts - a.ts);

  // 5/6 RAW MATERIAL CONSUMPTION per product: planned (recipe) vs consumed (raw lines of matched runs)
  const cons = (cfg.products || []).map((p, idx) => {
    const rs = done.filter(r => nameHit(r.outProduct, p.match || p.name)), used = new Map();
    rs.forEach(r => (r.rawLines || []).forEach(l => { const k = l.name || '-'; const c = used.get(k) || { name: k, qty: 0, unit: l.unit }; c.qty += Number(l.qty || 0); used.set(k, c); }));
    const rows = (p.recipe || []).filter(x => x.material).map(x => {
      const hit = [...used.values()].filter(u => nameHit(u.name, x.material)); hit.forEach(h => used.delete(h.name));
      const consumed = hit.reduce((s, h) => s + h.qty, 0), planned = (Number(x.planned) || 0) * win.days;
      return { material: x.material, planned, consumed, balance: planned - consumed, pct: planned > 0 ? consumed / planned * 100 : null, unit: (hit[0] && hit[0].unit) || p.unit || '' };
    });
    [...used.values()].forEach(u => rows.push({ material: u.name, planned: null, consumed: u.qty, balance: null, pct: null, unit: u.unit }));
    return { name: p.name, unit: p.unit || '', rows, runs: rs.length };
  });

  // 7 DISPATCH (approved GINs, grouped by item)
  const dm = new Map();
  D.gin.filter(v => whOk(v.warehouse_id) && inWin(win, v.date, clockOf(v.approved_at || v.created_at))).forEach(v => (v.gin_items || []).forEach(l => {
    const it = itemById.get(l.item_id) || {}, n = it.name || l.item_name || '-', c = dm.get(n) || { name: n, unit: l.unit || it.unit, qty: 0 }; c.qty += Number(l.qty_issued || 0); dm.set(n, c);
  }));
  const disp = [...dm.values()].sort((a, b) => b.qty - a.qty);

  // 8 MATERIAL STOCK (items + tanks)
  const stockByItem = new Map(); D.stock.forEach(s => stockByItem.set(s.item_id, (stockByItem.get(s.item_id) || 0) + Number(s.qty || 0)));
  const byCode = new Map();
  D.items.filter(i => i.status === 'Active' && whOk(i.warehouse_id)).forEach(i => {
    const k = i.code || i.name, c = byCode.get(k) || { key: 'i:' + k, name: i.name, unit: i.unit, category: i.category, qty: 0, cap: Number((cfg.capacities || {})[i.code]) || 0, kind: 'item' };
    c.qty += stockByItem.get(i.id) || 0; byCode.set(k, c);
  });
  const tankRows = tanksFor(user, isSA).filter(t => t.status !== 'Disabled').map(t => ({ key: 't:' + t.id, name: t.name, unit: t.unit, category: (itemById.get(t.itemId) || {}).category || null, qty: t.qty, cap: t.capacity, kind: 'tank', product: t.product }));
  const itemRows = [...byCode.values()].filter(r => r.qty > 0 || r.cap > 0).sort((a, b) => (b.cap > 0) - (a.cap > 0) || b.qty - a.qty);
  const stockRows = [...tankRows, ...itemRows].map(r => ({ ...r, pct: r.cap > 0 ? r.qty / r.cap * 100 : null, catName: r.category ? catName(r.category) : 'Tanks' }));
  const stockTabs = ['All Materials', ...[...new Set(stockRows.map(r => r.catName))].slice(0, 6)];

  // 9 FINAL PRODUCTS (tank contents + stock of final-product categories) and tank-wise stock
  const fcats = new Set((cfg.finalCategories && cfg.finalCategories.length) ? cfg.finalCategories : cats.filter(c => /final|finish|product/i.test(c.name)).map(c => c.id));
  const fm = new Map();
  const isFinalTank = t => fcats.size === 0 || fcats.has(t.category);
  tankRows.filter(t => t.qty > 0 && isFinalTank(t)).forEach(t => { const k = t.product || t.name; const c = fm.get(k) || { name: k, unit: t.unit, qty: 0 }; c.qty += t.qty; fm.set(k, c); });
  byCode.forEach(r => { if (r.qty > 0 && fcats.has(r.category)) { const c = fm.get(r.name) || { name: r.name, unit: r.unit, qty: 0 }; c.qty += r.qty; fm.set(r.name, c); } });
  const allF = [...fm.values()].sort((a, b) => b.qty - a.qty), uc = new Map(); allF.forEach(r => uc.set(r.unit, (uc.get(r.unit) || 0) + 1));
  const domUnit = [...uc.entries()].sort((a, b) => b[1] - a[1])[0]; const finalRows = allF.filter(r => !domUnit || r.unit === domUnit[0]);
  const fin = { rows: finalRows, unit: domUnit ? domUnit[0] : '', total: finalRows.reduce((s, r) => s + r.qty, 0), hidden: allF.length - finalRows.length,
    tanks: tankRows.filter(isFinalTank).map(t => ({ id: t.key, name: t.name, product: t.product || '\u2014', qty: t.qty, unit: t.unit })) };

  return { prod, run, recv, trn: trnRows, cons, disp, stock: stockRows, stockTabs, fin };
}

const OPS_NUM_COLORS = ['#2563eb', '#7c3aed', '#f97316', '#ec4899', '#16a34a', '#16a34a', '#8b5cf6', '#2563eb', '#f59e0b'];

function OpsConfig({ cfg, onClose, onSaved }) {
  const { toast, user } = useCtx();
  const [c, setC] = useState(() => JSON.parse(JSON.stringify(cfg)));
  const [q, setQ] = useState(''); const [items, setItems] = useState([]); const [busy, setBusy] = useState(false); const lock = useRef(false);

  if (mode === 'ops') return E(OpsDashboard, { onClassic: () => pick('classic') });
  return E('div', null, E('div', { style: { display: 'flex', justifyContent: 'flex-end', marginBottom: 8 } }, E('button', { className: 'btn btn-outline btn-sm', onClick: () => pick('ops') }, '\u25a6 Operations view')), E(Dashboard));
}

// ── CLEAR ALL ITEMS MODAL ──
function ClearItemsModal({onClose,onDone}){
  const [step,setStep]=useState('confirm'); // confirm → typing → deleting → done
  const [typed,setTyped]=useState('');
  const [progress,setProgress]=useState(0);
  const [log,setLog]=useState([]);
  const CONFIRM_WORD='DELETE ALL';

  const runDelete=async()=>{
    setStep('deleting');
    const addLog=(msg)=>setLog(p=>[...p,msg]);
    try{
      // Must delete in correct order: child tables first, then parent (items)
      // Step 1: Delete all line item tables that reference items.id
      const lineTables=[
        'purchase_items','gin_items','transfer_items',
        'consumption_items','production_raw_materials','production_outputs',
        'material_request_items','damaged_product_items'
      ];
      addLog('🗑 Clearing line item references...');
      for(let i=0;i<lineTables.length;i++){
        addLog('  → '+lineTables[i]);
        await sbFetch(lineTables[i]+'?id=not.is.null',{method:'DELETE',headers:{'Prefer':'return=minimal'}});
        setProgress(Math.round((i+1)/lineTables.length*40));
      }

      // Step 2: Delete stock (also references items.id)
      addLog('🗑 Deleting stock quantities...');
      await sbFetch('stock?id=not.is.null',{method:'DELETE',headers:{'Prefer':'return=minimal'}});
      setProgress(70);

      // Step 3: Now safe to delete items
      addLog('🗑 Deleting all items...');
      await sbFetch('items?id=not.is.null',{method:'DELETE',headers:{'Prefer':'return=minimal'}});
      setProgress(90);

      // Step 4: Clear local cache
      addLog('🧹 Clearing local cache...');
      itemSvc._cache=null;
      stockSvc._cache=null;
      db.s('items',[]);db.s('stock',[]);

      setProgress(100);
      addLog('✅ All items deleted successfully!');
      setStep('done');
    }catch(e){
      addLog('❌ Error: '+e.message);
      setStep('error');
    }
  };

  return React.createElement(Modal,{title:'🗑️ Clear All Items',onClose:step==='deleting'?null:onClose,size:'sm'},
    // Step 1: Confirm
    step==='confirm'&&React.createElement('div',null,
      React.createElement('div',{style:{background:'#fef2f2',border:'2px solid var(--red)',borderRadius:'var(--r)',padding:'14px',marginBottom:16}},
        React.createElement('div',{style:{fontWeight:800,fontSize:14,color:'var(--red)',marginBottom:8}},'⚠️ This will permanently delete:'),
        React.createElement('ul',{style:{margin:0,paddingLeft:18,fontSize:12,color:'var(--red)',lineHeight:1.8}},
          React.createElement('li',null,'All items across ALL warehouses'),
          React.createElement('li',null,'All stock quantities')
        ),
        React.createElement('div',{style:{fontWeight:700,fontSize:12,color:'var(--red)',marginTop:8}},'Vouchers & transactions are kept. This cannot be undone.')
      ),
      React.createElement('div',{className:'fg',style:{marginBottom:14}},
        React.createElement('label',{className:'flbl'},'Type  '+CONFIRM_WORD+'  to confirm'),
        React.createElement('input',{
          className:'fi',
          value:typed,
          onChange:e=>setTyped(e.target.value.toUpperCase()),
          placeholder:CONFIRM_WORD,
          style:{fontFamily:'var(--mono)',fontWeight:700,letterSpacing:'2px',
            borderColor:typed===CONFIRM_WORD?'var(--red)':'var(--border2)'}
        })
      ),
      React.createElement('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
        React.createElement('button',{className:'btn btn-outline',onClick:onClose},'Cancel'),
        React.createElement('button',{
          className:'btn btn-danger',
          disabled:typed!==CONFIRM_WORD,
          onClick:runDelete,
          style:{opacity:typed===CONFIRM_WORD?1:0.5}
        },'🗑️ Delete Everything')
      )
    ),

    // Step 2: Deleting progress
    step==='deleting'&&React.createElement('div',null,
      React.createElement('div',{style:{marginBottom:12}},
        React.createElement('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}},
          React.createElement('span',null,'Deleting...'),
          React.createElement('span',{style:{fontWeight:700}},progress+'%')
        ),
        React.createElement('div',{style:{height:8,background:'var(--border2)',borderRadius:20,overflow:'hidden'}},
          React.createElement('div',{style:{width:progress+'%',height:'100%',background:'var(--red)',borderRadius:20,transition:'width .3s'}})
        )
      ),
      React.createElement('div',{style:{maxHeight:180,overflowY:'auto',fontSize:11,background:'var(--off2)',borderRadius:'var(--r)',padding:'8px 10px'}},
        log.map((l,i)=>React.createElement('div',{key:i,style:{padding:'2px 0',color:l.startsWith('❌')?'var(--red)':l.startsWith('✅')?'var(--green)':'var(--txt2)'}},l))
      )
    ),

    // Step 3: Done
    step==='done'&&React.createElement('div',{style:{textAlign:'center',padding:'20px 0'}},
      React.createElement('div',{style:{fontSize:48,marginBottom:12}},'✅'),
      React.createElement('div',{style:{fontWeight:800,fontSize:16,marginBottom:6}},'All items deleted!'),

// ── BULK UPLOAD MODAL ──
function BulkUploadModal({whId,onDone,onClose}){
  const [step,setStep]=useState('upload');
  const [rows,setRows]=useState([]);
  const [errors,setErrors]=useState([]);
  const whs=whSvc.getAll();
  const [selWh,setSelWh]=useState(whId||whs[0]?.id||'');
  const UNITS=['NOS','KG','MTR','LTR','SET','BOX','PAIR','ROLL','PKT','BTL','DRM','SHT'];
  const COLS='Name*,Code(auto if blank),Category*(MECH/ELEC/INST/SAFE/GEN),Sub-Category(code or blank),Unit*,Cost Price*,Min Stock,Opening Qty,Is Asset(YES/NO),Asset Code,Description,Rack Code';

  const downloadTemplate=()=>{
    const cats=catSvc.getAll();
    const subCatRef=cats.filter(c=>c.parentId).map(c=>c.id).join('/');
    const commentLine='# Sub-Category codes available: '+(subCatRef||'none yet — add in Category Master');
    const sample=[
      'Bearing 6205,,MECH,BEAR,NOS,120,5,10,NO,,Deep groove ball bearing,R-01-01',
      'Safety Helmet,,SAFE,,NOS,220,10,25,NO,,ISI marked hard hat,R-04-01',
      'Control Panel,,ELEC,,NOS,15000,1,2,YES,ASSET-2024-001,Main control panel,R-02-01',
    ];
    const blob=new Blob([[commentLine,COLS,...sample].join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bulk-upload-template.csv';a.click();
  };

  const parseCSV=(text)=>{
    const rawLines=text.trim().split('\n').map(l=>l.replace(/\r$/,''));
    const parsed=[];const errs=[];
    const allRacks=rackSvc.getAll(selWh);
    const allCats=catSvc.getAll();

    // ── Auto-detect header row (skip comment lines and find the header) ──
    const dataLines=rawLines.filter(l=>l.trim()&&!l.trim().startsWith('#'));
    if(dataLines.length<2){return {parsed:[],errs:['CSV is empty or has no data rows']};}

    // Detect header and figure out column positions dynamically
    const hdr=dataLines[0].split(',').map(s=>s.trim().toLowerCase().replace(/[^a-z0-9]/g,''));
    const colIdx=(keywords)=>{
      for(const kw of keywords){
        const i=hdr.findIndex(h=>h.includes(kw));
        if(i>=0)return i;
      }
      return -1;
    };

    // Map columns by keywords - works for any column order
    const iName     = colIdx(['name']);
    const iCode     = colIdx(['code','itemcode']);
    const iCat      = colIdx(['category','cat']);
    const iSub      = colIdx(['sub','subcategory','subcategories']);
    const iUnit     = colIdx(['unit','uom']);
    const iPrice    = colIdx(['price','cost','rate']);
    const iMinStock = colIdx(['min','minimum']);
    const iQty      = colIdx(['opening','qty','quantity','stock']);
    const iAsset    = colIdx(['asset']);
    const iAssetCode= colIdx(['assetcode','assetno']);
    const iDesc     = colIdx(['desc','description','remark']);
    const iRack     = colIdx(['rack','location','bin']);

    if(iName<0){return {parsed:[],errs:['Could not find a "Name" column in the CSV header']};}
    if(iPrice<0){return {parsed:[],errs:['Could not find a "Price/Cost" column in the CSV header']};}

    // Helper: resolve category by id OR name → return catId
    const resolveOrCreateCat=(rawVal,parentCatId)=>{
      if(!rawVal)return null;
      const v=rawVal.trim();
      // Try exact ID match first
      let cat=allCats.find(c=>c.id===v.toUpperCase());
      if(cat)return cat.id;
      // Try name match (case-insensitive)
      cat=allCats.find(c=>c.name.toLowerCase()===v.toLowerCase()&&(parentCatId?c.parentId===parentCatId:!c.parentId));
      if(cat)return cat.id;
      // Try partial match
      cat=allCats.find(c=>c.name.toLowerCase().includes(v.toLowerCase())&&(parentCatId?c.parentId===parentCatId:!c.parentId));
      if(cat)return cat.id;
      return null; // not found
    };

    // Collect unknown categories for auto-create hint
    const unknownCats=new Set();
    const unknownSubs={};

    dataLines.slice(1).forEach((line,i)=>{
      if(!line.trim())return;
      const cols=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
      const g=(idx)=>idx>=0&&idx<cols.length?cols[idx]:'';
      const rowNum=i+2;

      const name=g(iName);
      if(!name){errs.push('Row '+rowNum+': Name is required');return;}

      // Price
      const rawPrice=g(iPrice);
      if(!rawPrice||isNaN(rawPrice)){errs.push('Row '+rowNum+' "'+name+'": Cost Price must be a number (got "'+rawPrice+'")');return;}

      // Category - resolve by name or code
      const rawCat=g(iCat)||'GEN';
      const catId=resolveOrCreateCat(rawCat,null);
      if(!catId){
        unknownCats.add(rawCat);
        errs.push('Row '+rowNum+' "'+name+'": Unknown category "'+rawCat+'" — will be shown in preview as GEN');
      }

      // Sub-category - resolve by name or code under the found parent
      const rawSub=g(iSub);
      let subCatId='';
      if(rawSub&&catId){
        subCatId=resolveOrCreateCat(rawSub,catId)||'';
        if(!subCatId){
          if(!unknownSubs[rawCat])unknownSubs[rawCat]=new Set();
          unknownSubs[rawCat].add(rawSub);
          // Don't error — just leave blank, user can fix in preview
        }
      }

      const unit=g(iUnit)||'NOS';
      const minStock=Number(g(iMinStock))||0;
      const openingQty=Number(g(iQty))||0;
      const isAssetBool=(g(iAsset)||'').toUpperCase()==='YES';
      // Auto-generate asset code if asset but no code provided
      const rawAssetCode=g(iAssetCode)||'';
      const assetCode=rawAssetCode||(isAssetBool?'ASSET-'+Date.now().toString(36).toUpperCase().slice(-6):'');
      const desc=g(iDesc)||'';
      const rackCode=g(iRack)||'';
      const rack=allRacks.find(r=>r.code===rackCode)||null;
      const code=g(iCode)||'';

      parsed.push({
        name,
        category:catId||'GEN',
        subCategory:subCatId||'',
        unit,
        costPrice:Number(rawPrice)||0,
        minStock,openingQty,
        isAsset:isAssetBool,assetCode,
        description:desc,rackId:rack?.id||'',
        whId:selWh,
        code:code||'',
        status:'Active',
        _rawCat:rawCat,
        _rawSub:rawSub||'',
      });
    });

    // Add summary warnings for unknown cats/subs (not errors - user can fix in preview)
    if(unknownCats.size>0){
      errs.unshift('⚠️ Unknown categories (set to GEN — fix in preview): '+[...unknownCats].join(', '));
    }
    Object.entries(unknownSubs).forEach(([cat,subs])=>{
      errs.push('⚠️ Sub-categories not found under "'+cat+'" (cleared — fix in preview): '+[...subs].join(', '));
    });

    return {parsed,errs};
  };

  const handleFile=(ev)=>{
    const file=ev.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(e)=>{
      const {parsed,errs}=parseCSV(e.target.result);
      setRows(parsed);setErrors(errs);
      // Always go to preview so user can edit rows inline even if there are errors
      setStep(parsed.length>0?'preview':'errors');
    };
    reader.readAsText(file);
  };

  const [importing,setImporting]=useState(false);
  const [importProgress,setImportProgress]=useState(0);

  const importAll=async()=>{
    setImporting(true);setImportProgress(0);
    let count=0;
    for(let i=0;i<rows.length;i++){
      const row=rows[i];
      try{
        // Check if item with same code already exists in this warehouse
        const existing=itemSvc.getAll(row.whId).find(it=>it.code===row.code);
        if(existing){
          // Item exists — just update its stock
          await stockSvc.setQty(existing.id,existing.whId,Number(row.openingQty||0));
        } else {
          // Auto-generate asset code at import time if still missing
          const importRow={...row,costPrice:Number(row.costPrice||0),minStock:Number(row.minStock||0),openingQty:Number(row.openingQty||0)};
          if(importRow.isAsset&&!importRow.assetCode)importRow.assetCode='ASSET-'+String(i+1).padStart(4,'0');
          // New item — create in all warehouses
          await itemSvc.create(importRow);
        }
        count++;
        setImportProgress(Math.round((i+1)/rows.length*100));
      }catch(e){
        console.warn('Row skip:',e.message);
      }
    }
    setImporting(false);
    onDone(count);
  };

  return React.createElement(Modal,{title:'Bulk Upload Items',onClose,size:'lg'},
    step==='upload'&&React.createElement('div',null,
      React.createElement('div',{className:'alert alert-blue',style:{marginBottom:12}},
        React.createElement(Ic,{n:'info',s:13}),' Download template, fill items, then upload. ',React.createElement('strong',null,'Opening Qty sets initial stock immediately.')
      ),
      React.createElement('div',{className:'fg',style:{marginBottom:12}},
        React.createElement('label',{className:'flbl'},'Import to Warehouse'),
        React.createElement('select',{className:'fi',value:selWh,onChange:e=>setSelWh(e.target.value)},whs.map(w=>React.createElement('option',{key:w.id,value:w.id},w.name)))
      ),
      React.createElement('div',{style:{display:'flex',gap:10,marginBottom:16}},
        React.createElement('button',{className:'btn btn-outline',onClick:downloadTemplate},'Download Template CSV'),
        React.createElement('label',{className:'btn btn-primary',style:{cursor:'pointer'}},
          'Upload Filled CSV',
          React.createElement('input',{type:'file',accept:'.csv',style:{display:'none'},onChange:handleFile})
        )
      ),
      React.createElement('div',{style:{background:'var(--off2)',borderRadius:'var(--r)',padding:'12px 14px',fontSize:11}},
        React.createElement('div',{style:{fontWeight:700,marginBottom:4}},'CSV Columns:'),
        React.createElement('code',null,COLS)
      )
    ),

    (step==='preview'||step==='errors')&&React.createElement('div',null,
      step==='errors'&&React.createElement('div',{className:'alert alert-amber',style:{marginBottom:10}},
        React.createElement(Ic,{n:'alert',s:13}),' ',String(errors.length),' error(s) found — fix below and click Import, or go back.'
      ),
      step==='preview'&&React.createElement('div',{className:'alert alert-green',style:{marginBottom:10}},
        React.createElement(Ic,{n:'check',s:13}),' ',String(rows.length),' items ready. You can edit any cell before importing.'
      ),
      // Errors list
      errors.length>0&&React.createElement('div',{style:{marginBottom:10,maxHeight:80,overflowY:'auto'}},
        errors.map((e,i)=>React.createElement('div',{key:i,style:{fontSize:11,color:'var(--red)',padding:'2px 0'}},e))
      ),
      // Editable table
      React.createElement('div',{className:'tw',style:{maxHeight:340,overflowY:'auto',marginBottom:12}},
        React.createElement('table',null,
          React.createElement('thead',null,React.createElement('tr',null,
            ['#','Code','Name*','Category*','Sub-Cat','Unit','Price*','Opening Qty','Asset',''].map(h=>React.createElement('th',{key:h,style:{fontSize:10}},h))
          )),
          React.createElement('tbody',null,
            rows.map((row,i)=>{
              const allCats=catSvc.getAll();
              const rootCats=allCats.filter(c=>!c.parentId);
              const subCats=allCats.filter(c=>c.parentId===row.category);
              const updateRow=(field,val)=>setRows(prev=>prev.map((r,idx)=>idx===i?{...r,[field]:val}:r));
              const deleteRow=()=>setRows(prev=>prev.filter((_,idx)=>idx!==i));
              return React.createElement('tr',{key:i,style:{verticalAlign:'middle'}},
                React.createElement('td',{style:{color:'var(--txt3)',fontSize:11}},String(i+1)),
                // Code
                React.createElement('td',null,React.createElement('input',{
                  style:{width:80,fontFamily:'var(--mono)',fontSize:10,padding:'3px 5px',border:'1px solid var(--border2)',borderRadius:4},
                  value:row.code||'',
                  onChange:e=>updateRow('code',e.target.value.toUpperCase()),
                  placeholder:'auto'
                })),
                // Name
                React.createElement('td',null,React.createElement('input',{
                  style:{width:140,fontSize:11,padding:'3px 5px',border:'1px solid var(--border2)',borderRadius:4,fontWeight:600},
                  value:row.name||'',

                React.createElement('td',null,React.createElement('select',{

                },
                  React.createElement('option',{value:''},'— Select —'),

                )),

                React.createElement('td',null,React.createElement('select',{

                },
                  React.createElement('option',{value:''},'—'+(row._rawSub&&!row.subCategory?' (was: '+row._rawSub+')':'')),

                })),
                // Asset
                React.createElement('td',null,React.createElement('select',{

                  value:row.isAsset?'YES':'NO',

                // Delete row
                React.createElement('td',null,React.createElement('button',{

                'Importing... '+importProgress+'%'
              )
            : 'Import '+String(rows.length)+' Items'
        )
      )
    )
  );
}

// ── Change Password Modal ──
function ChangePasswordModal({user,onClose,onSaved}){
  const {toast}=useCtx();
  const [oldPwd,setOldPwd]=useState('');
  const [newPwd,setNewPwd]=useState('');
  const [confirm,setConfirm]=useState('');
  const [err,setErr]=useState('');
  const [saving,setSaving]=useState(false);

  const save=async()=>{
    setErr('');
    if(!oldPwd){setErr('Enter your current password');return;}
    if(oldPwd!==user.password){setErr('Current password is incorrect');return;}
    if(!newPwd||newPwd.length<6){setErr('New password must be at least 6 characters');return;}
    if(newPwd!==confirm){setErr('Passwords do not match');return;}
    setSaving(true);
    try{
      await userSvc.update(user.id,{...user,password:newPwd});
      // Update session
      const sess={...user,password:newPwd};
      db.s('session',sess);
      onSaved();
    }catch(e){
      setErr(e.message||'Failed to change password');
    }finally{setSaving(false);}
  };

  return React.createElement(Modal,{title:'🔐 Change Password',onClose,size:'sm'},
    React.createElement('div',{className:'alert alert-blue',style:{marginBottom:14}},
      React.createElement(Ic,{n:'info',s:13}),' Changing password for: ',React.createElement('strong',null,user.name),' (',user.username,')'
    ),
    React.createElement('div',{className:'fg',style:{marginBottom:10}},
      React.createElement('label',{className:'flbl'},'Current Password'),
      React.createElement('input',{className:'fi',type:'password',value:oldPwd,onChange:e=>setOldPwd(e.target.value),placeholder:'Enter current password',autoFocus:true})
    ),
    React.createElement('div',{className:'fg',style:{marginBottom:10}},
      React.createElement('label',{className:'flbl'},'New Password'),
      React.createElement('input',{className:'fi',type:'password',value:newPwd,onChange:e=>setNewPwd(e.target.value),placeholder:'Minimum 6 characters'})
    ),
    React.createElement('div',{className:'fg',style:{marginBottom:12}},
      React.createElement('label',{className:'flbl'},'Confirm New Password'),
      React.createElement('input',{className:'fi',type:'password',value:confirm,onChange:e=>setConfirm(e.target.value),placeholder:'Re-enter new password',
        onKeyDown:e=>e.key==='Enter'&&save()})
    ),
    err&&React.createElement('div',{className:'alert alert-red',style:{marginBottom:10}},
      React.createElement(Ic,{n:'alert',s:13}),' ',err
    ),
    null,
    React.createElement('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
      React.createElement('button',{className:'btn btn-outline',onClick:onClose,disabled:saving},'Cancel'),
      React.createElement('button',{className:'btn btn-primary',onClick:save,disabled:saving},
        saving?'Saving...':'Change Password'
      )
    )
  );
}
